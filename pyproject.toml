[project]
name = "aeps-alumni"
version = "5.0.0"
requires-python = ">=3.11"
dependencies = [
    "Django==5.2.19",
    "supabase==2.34.1",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "pillow==13.0.0",
    "whitenoise==6.12.0",
    "gunicorn==27.0.1",
    "redis==5.2.1",
]    "redis==5.2.1",

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alumni/migrations", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S311", "B904", "UP017"]

[tool.ruff.lint.per-file-ignores]
"alumni/tests/*" = ["S"]
"alumni/management/*" = ["S"]
