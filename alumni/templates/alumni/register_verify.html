{% extends "alumni/base.html" %}
{% block title %}Vérification - AEPS-ALUMNI{% endblock %}

{% block content %}
<div class="flex items-center justify-center bg-gray-50 px-4 py-12">
  <div class="max-w-2xl w-full bg-white p-10 rounded-2xl shadow-md border border-gray-100">
    <div class="text-center space-y-8 py-10">
      <div class="w-20 h-20 bg-sky-50 text-sky-700 rounded-3xl flex items-center justify-center mx-auto shadow-inner">
        <i data-lucide="shield-check" class="w-10 h-10"></i>
      </div>
      <div class="space-y-2">
        <h2 class="text-3xl font-semibold text-black">Vérifiez votre email</h2>
        <p class="text-gray-500 font-bold text-sm">
          Un code de vérification a été envoyé à <br>
          <span class="text-sky-700 font-semibold">{{ email }}</span>
        </p>
      </div>

      {% if error %}
      <div class="bg-red-50 text-red-600 p-4 rounded-2xl text-sm font-bold border border-red-100">{{ error }}</div>
      {% endif %}

      <form method="post" class="space-y-6">
        {% csrf_token %}
        <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus placeholder="000000"
               class="w-full text-center text-4xl font-semibold tracking-[1rem] py-6 bg-gray-50 border border-gray-200 rounded-3xl focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 outline-none transition-all text-black">
        <button type="submit" class="w-full py-4 bg-sky-600 text-white font-semibold rounded-2xl hover:bg-sky-700 shadow-sm transition-all active:scale-95">
          Confirmer l'inscription
        </button>
      </form>

      <div class="flex flex-col items-center gap-4">
        <form method="post" action="{% url 'register_resend' %}">
          {% csrf_token %}
          <button type="submit" class="text-sky-700 hover:text-sky-700 text-sm font-semibold">Renvoyer un code</button>
        </form>
        <a href="{% url 'register' %}" class="text-gray-400 hover:text-gray-600 text-sm font-semibold tracking-wide">
          Retourner au formulaire
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
