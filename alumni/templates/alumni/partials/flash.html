{% if messages %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 mb-2 space-y-3 print:hidden" role="status">
  {% for message in messages %}
    <div class="flex items-center gap-3 px-5 py-4 rounded-2xl border font-semibold text-sm {% if message.level_tag == 'success' %}bg-emerald-50 text-emerald-700 border-emerald-100 {% elif message.level_tag == 'error' %}bg-red-50 text-red-600 border-red-100 {% elif message.level_tag == 'warning' %}bg-amber-50 text-amber-700 border-amber-100 {% else %}bg-sky-50 text-sky-700 border-sky-100{% endif %}">
      <i data-lucide="{% if message.level_tag == 'success' %}check-circle{% elif message.level_tag == 'error' %}alert-circle{% else %}info{% endif %}" class="w-5 h-5 shrink-0"></i>
      <span>{{ message }}</span>
    </div>
  {% endfor %}
</div>
{% endif %}
