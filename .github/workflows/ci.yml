name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-0000
      DJANGO_DEBUG: "1"
      SUPABASE_URL: http://supabase.invalid
      SUPABASE_KEY: ci
      ADMIN_PASSWORD: ci-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py test alumni -v 2
